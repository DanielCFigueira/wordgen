repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: bloquear-dados
        name: bloquear arquivos de dados
        entry: Arquivo de dados nao pode ser commitado (contem dados de menores)
        language: fail
        files: \.(csv|parquet|xlsx|xls|duckdb|zip)$
        exclude: ^tests/fixtures/
