[project]
name = "wordgen"
version = "0.1.0"
description = "Análise educacional, modelagem preditiva e assistente RAG do projeto WordGen"
readme = "README.md"
authors = [
    { name = "Daniel C. Figueira", email = "danielfigueira1418@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "groq>=1.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pandera[pandas]>=0.34.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
]

[project.scripts]
wordgen = "wordgen:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["pipeline", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
